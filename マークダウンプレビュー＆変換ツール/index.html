<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークダウンプレビュー＆変換ツール</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262638;
    --accent: #6ea8fe;
    --text: #e8e6f2;
    --muted: #9a97b5;
    --border: #3a3a52;
    --good: #43d692;
    --warn: #fad165;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding: 20px;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--muted); margin: 0 0 16px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .toolbar label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  select, button {
    background: #333350;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10101a; font-weight: bold; border: none; }
  .stats { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .stats span b { color: var(--text); }

  .layout {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    flex: 1 1 400px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: normal; }
  textarea {
    width: 100%;
    min-height: 420px;
    resize: vertical;
    background: #17171f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  #preview {
    background: #17171f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    min-height: 420px;
    overflow: auto;
    line-height: 1.7;
    font-size: 14px;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 { margin-top: 0.6em; margin-bottom: 0.4em; line-height: 1.3; }
  #preview h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #preview h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
  #preview h3 { font-size: 1.15em; }
  #preview p { margin: 0.5em 0; }
  #preview a { color: var(--accent); }
  #preview img { max-width: 100%; border-radius: 6px; }
  #preview code { background: #333350; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
  #preview pre { background: #10101a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote { border-left: 3px solid var(--accent); margin: 0.6em 0; padding: 2px 12px; color: var(--muted); }
  #preview ul, #preview ol { padding-left: 22px; margin: 0.5em 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  #preview table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.92em; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  #preview th { background: #2f2f46; }
  #preview .empty { color: var(--muted); font-style: italic; }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--good);
    color: #10101a;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .stats { margin-left: 0; }
    textarea, #preview { min-height: 260px; }
  }
</style>
</head>
<body>

<header>
  <h1>📝 マークダウンプレビュー＆変換ツール</h1>
  <p>Markdownをリアルタイムでプレビュー。HTML/プレーンテキストへのコピーや.mdダウンロードもその場でできます（入力内容は外部送信されません）。</p>
</header>

<div class="toolbar">
  <label for="templateSelect">雛形:</label>
  <select id="templateSelect">
    <option value="">選択してください</option>
    <option value="readme">README雛形</option>
    <option value="minutes">議事録雛形</option>
    <option value="daily">日報雛形</option>
  </select>
  <button id="insertTemplateBtn">挿入</button>
  <button id="clearBtn">クリア</button>
  <button id="copyHtmlBtn" class="primary">HTMLとしてコピー</button>
  <button id="copyPlainBtn">プレーンテキストとしてコピー</button>
  <button id="downloadBtn">.mdダウンロード</button>
  <div class="stats">
    <span>文字数: <b id="charCount">0</b></span>
    <span>単語数: <b id="wordCount">0</b></span>
    <span>見出し数: <b id="headingCount">0</b></span>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <h2>Markdown入力</h2>
    <textarea id="mdInput" placeholder="ここにMarkdownを入力してください…&#10;&#10;# 見出し&#10;本文はここに書きます。&#10;&#10;- リスト項目1&#10;- リスト項目2"></textarea>
  </div>
  <div class="panel">
    <h2>プレビュー</h2>
    <div id="preview"><p class="empty">左側にMarkdownを入力するとここにプレビューが表示されます。</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var mdInput = document.getElementById('mdInput');
  var preview = document.getElementById('preview');
  var toast = document.getElementById('toast');
  var charCount = document.getElementById('charCount');
  var wordCount = document.getElementById('wordCount');
  var headingCount = document.getElementById('headingCount');

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 軽量Markdownパーサー（外部ライブラリ不使用）
  function parseMarkdown(src) {
    if (!src || !src.trim()) return '';

    var lines = src.replace(/\r\n?/g, '\n').split('\n');
    var html = [];
    var i = 0;
    var inCodeBlock = false;
    var codeBuf = [];
    var codeLang = '';
    var listStack = []; // {type:'ul'|'ol'}
    var paraBuf = [];

    function flushParagraph() {
      if (paraBuf.length) {
        html.push('<p>' + inlineFormat(paraBuf.join(' ')) + '</p>');
        paraBuf = [];
      }
    }
    function closeLists() {
      while (listStack.length) {
        html.push('</' + listStack.pop().type + '>');
      }
    }

    function inlineFormat(text) {
      var escaped = escapeHtml(text);
      // インラインコード
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      // 画像 ![alt](url)
      escaped = escaped.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
      // リンク [text](url)
      escaped = escaped.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // 太字
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      // 斜体
      escaped = escaped.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      escaped = escaped.replace(/(^|[^_])_([^_]+)_(?!_)/g, '$1<em>$2</em>');
      return escaped;
    }

    while (i < lines.length) {
      var line = lines[i];

      // コードブロック
      var fenceMatch = line.match(/^```\s*(\S*)\s*$/);
      if (fenceMatch) {
        if (!inCodeBlock) {
          flushParagraph();
          closeLists();
          inCodeBlock = true;
          codeLang = fenceMatch[1] || '';
          codeBuf = [];
        } else {
          html.push('<pre><code class="lang-' + escapeHtml(codeLang) + '">' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
          inCodeBlock = false;
        }
        i++;
        continue;
      }
      if (inCodeBlock) {
        codeBuf.push(line);
        i++;
        continue;
      }

      // 水平線
      if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line) && line.trim().length >= 3) {
        flushParagraph();
        closeLists();
        html.push('<hr>');
        i++;
        continue;
      }

      // 見出し
      var headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headingMatch) {
        flushParagraph();
        closeLists();
        var level = headingMatch[1].length;
        html.push('<h' + level + '>' + inlineFormat(headingMatch[2].trim()) + '</h' + level + '>');
        i++;
        continue;
      }

      // 引用
      var quoteMatch = line.match(/^>\s?(.*)$/);
      if (quoteMatch) {
        flushParagraph();
        closeLists();
        var quoteLines = [quoteMatch[1]];
        i++;
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quoteLines.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        html.push('<blockquote><p>' + inlineFormat(quoteLines.join(' ')) + '</p></blockquote>');
        continue;
      }

      // テーブル（ヘッダー行 + 区切り行）
      if (/\|/.test(line) && i + 1 < lines.length && /^[\s|:\-]+$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') !== -1) {
        flushParagraph();
        closeLists();
        var headerCells = line.split('|').map(function (s) { return s.trim(); }).filter(function (s, idx, arr) { return !(s === '' && (idx === 0 || idx === arr.length - 1)); });
        var tableRows = [];
        i += 2;
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim() !== '') {
          var cells = lines[i].split('|').map(function (s) { return s.trim(); }).filter(function (s, idx, arr) { return !(s === '' && (idx === 0 || idx === arr.length - 1)); });
          tableRows.push(cells);
          i++;
        }
        var t = '<table><thead><tr>';
        headerCells.forEach(function (c) { t += '<th>' + inlineFormat(c) + '</th>'; });
        t += '</tr></thead><tbody>';
        tableRows.forEach(function (row) {
          t += '<tr>';
          row.forEach(function (c) { t += '<td>' + inlineFormat(c) + '</td>'; });
          t += '</tr>';
        });
        t += '</tbody></table>';
        html.push(t);
        continue;
      }

      // 番号付きリスト
      var olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
      if (olMatch) {
        flushParagraph();
        if (!listStack.length || listStack[listStack.length - 1].type !== 'ol') {
          closeLists();
          html.push('<ol>');
          listStack.push({ type: 'ol' });
        }
        html.push('<li>' + inlineFormat(olMatch[1]) + '</li>');
        i++;
        continue;
      }

      // 箇条書きリスト
      var ulMatch = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ulMatch) {
        flushParagraph();
        if (!listStack.length || listStack[listStack.length - 1].type !== 'ul') {
          closeLists();
          html.push('<ul>');
          listStack.push({ type: 'ul' });
        }
        html.push('<li>' + inlineFormat(ulMatch[1]) + '</li>');
        i++;
        continue;
      }

      // 空行
      if (line.trim() === '') {
        flushParagraph();
        closeLists();
        i++;
        continue;
      }

      // 通常の段落
      paraBuf.push(line.trim());
      i++;
    }

    flushParagraph();
    closeLists();
    if (inCodeBlock && codeBuf.length) {
      html.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
    }
    return html.join('\n');
  }

  function stripMarkdown(src) {
    return src
      .replace(/```[\s\S]*?```/g, function (m) { return m.replace(/```/g, ''); })
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/(\*\*|__)([^*_]+)\1/g, '$2')
      .replace(/(\*|_)([^*_]+)\1/g, '$2')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^>\s?/gm, '')
      .replace(/^\s*[-*+]\s+/gm, '・')
      .replace(/^\s*\d+\.\s+/gm, '')
      .replace(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/gm, '');
  }

  function updateStats(src) {
    var trimmed = src.trim();
    charCount.textContent = src.length;
    wordCount.textContent = trimmed === '' ? 0 : trimmed.split(/\s+/).length;
    var headings = (src.match(/^#{1,6}\s+.+$/gm) || []).length;
    headingCount.textContent = headings;
  }

  function render() {
    var src = mdInput.value;
    updateStats(src);
    var out = parseMarkdown(src);
    preview.innerHTML = out || '<p class="empty">左側にMarkdownを入力するとここにプレビューが表示されます。</p>';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(successMsg);
      }).catch(function () {
        fallbackCopy(text, successMsg);
      });
    } else {
      fallbackCopy(text, successMsg);
    }
  }

  function fallbackCopy(text, successMsg) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg);
    } catch (e) {
      showToast('コピーに失敗しました。手動で選択してください');
    }
    document.body.removeChild(ta);
  }

  var templates = {
    readme:
      '# アプリ名\n\n' +
      '簡単な概要説明をここに書きます。\n\n' +
      '## 機能\n\n' +
      '- 機能1\n' +
      '- 機能2\n' +
      '- 機能3\n\n' +
      '## 使い方\n\n' +
      '1. 手順1\n' +
      '2. 手順2\n' +
      '3. 手順3\n\n' +
      '## 対象者\n\n' +
      'どんな人のためのアプリかを書きます。\n',
    minutes:
      '# 議事録（YYYY-MM-DD）\n\n' +
      '## 参加者\n\n' +
      '- 参加者1\n' +
      '- 参加者2\n\n' +
      '## 議題\n\n' +
      '1. 議題1\n' +
      '2. 議題2\n\n' +
      '## 決定事項\n\n' +
      '- 決定事項1\n\n' +
      '## 次のアクション\n\n' +
      '- [ ] タスク1（担当:　期限:　）\n' +
      '- [ ] タスク2（担当:　期限:　）\n',
    daily:
      '# 日報（YYYY-MM-DD）\n\n' +
      '## 今日やったこと\n\n' +
      '- 項目1\n' +
      '- 項目2\n\n' +
      '## 気づき・課題\n\n' +
      '- 項目1\n\n' +
      '## 明日やること\n\n' +
      '- 項目1\n'
  };

  document.getElementById('insertTemplateBtn').addEventListener('click', function () {
    var key = document.getElementById('templateSelect').value;
    if (!key || !templates[key]) {
      showToast('雛形を選択してください');
      return;
    }
    if (mdInput.value.trim() !== '' && !confirm('現在の入力内容に雛形を追記します。よろしいですか？')) {
      return;
    }
    mdInput.value = mdInput.value + (mdInput.value.trim() ? '\n\n' : '') + templates[key];
    render();
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (mdInput.value.trim() !== '' && !confirm('入力内容をすべて消去します。よろしいですか？')) {
      return;
    }
    mdInput.value = '';
    render();
  });

  document.getElementById('copyHtmlBtn').addEventListener('click', function () {
    var html = parseMarkdown(mdInput.value);
    if (!html) { showToast('コピーする内容がありません'); return; }
    copyText(html, 'HTMLをコピーしました');
  });

  document.getElementById('copyPlainBtn').addEventListener('click', function () {
    var plain = stripMarkdown(mdInput.value).replace(/\n{3,}/g, '\n\n').trim();
    if (!plain) { showToast('コピーする内容がありません'); return; }
    copyText(plain, 'プレーンテキストをコピーしました');
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    var src = mdInput.value;
    if (!src.trim()) { showToast('ダウンロードする内容がありません'); return; }
    var blob = new Blob([src], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'document.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('document.md をダウンロードしました');
  });

  mdInput.addEventListener('input', render);

  // 初期サンプル
  mdInput.value =
    '# サンプル見出し\n\n' +
    'これは **マークダウンプレビュー＆変換ツール** のサンプルです。左のテキストを編集すると右側にリアルタイムでプレビューされます。\n\n' +
    '## 主な機能\n\n' +
    '- リアルタイムプレビュー\n' +
    '- HTML / プレーンテキストへのコピー\n' +
    '- テンプレート挿入（README・議事録・日報）\n' +
    '- .mdファイルとしてダウンロード\n\n' +
    '```js\n' +
    'console.log("コードブロックにも対応");\n' +
    '```\n\n' +
    '> 入力内容は一切外部送信されません。\n';
  render();
})();
</script>

</body>
</html>
