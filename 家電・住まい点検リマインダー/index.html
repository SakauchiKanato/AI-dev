<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家電・住まい点検リマインダー</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262638;
    --accent: #4a9e6e;
    --accent2: #c47a1d;
    --text: #e8e6f2;
    --muted: #9a97b5;
    --border: #3a3a52;
    --danger: #e05a5a;
    --warn: #d8b354;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.5;
  }
  header { margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }

  .layout { display: flex; flex-wrap: wrap; gap: 20px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .panel h3 { font-size: 13px; margin: 14px 0 8px; color: var(--muted); }

  .dashboard { flex: 1 1 100%; }
  .dash-cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .dash-card {
    flex: 1 1 200px;
    background: #1e1e2e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .dash-card .num { font-size: 24px; font-weight: bold; }
  .dash-card .label { font-size: 12px; color: var(--muted); }
  .dash-card.danger .num { color: var(--danger); }
  .dash-card.warn .num { color: var(--warn); }

  .col-left { flex: 1 1 380px; }
  .col-right { flex: 2 1 500px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%;
    padding: 8px;
    background: #1e1e2e;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    background: var(--accent);
    color: #fff;
    margin-top: 10px;
    margin-right: 6px;
  }
  button:hover { opacity: 0.85; }
  button.secondary { background: #3a3a52; }
  button.small { padding: 4px 10px; font-size: 12px; margin-top: 0; }
  button.danger-btn { background: var(--danger); }

  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .preset-row button { margin: 0; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter-row button { margin: 0; background: #1e1e2e; border: 1px solid var(--border); color: var(--muted); }
  .filter-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; font-size: 12px; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #3a3a52;
    color: var(--muted);
  }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: bold;
  }
  .status-badge.overdue { background: rgba(224,90,90,0.2); color: var(--danger); }
  .status-badge.soon { background: rgba(216,179,84,0.2); color: var(--warn); }
  .status-badge.ok { background: rgba(74,158,110,0.2); color: var(--accent); }

  tr.overdue-row { background: rgba(224,90,90,0.07); }
  tr.soon-row { background: rgba(216,179,84,0.07); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .empty-msg { color: var(--muted); font-size: 13px; padding: 10px 0; }

  .log-list { max-height: 220px; overflow-y: auto; font-size: 12px; }
  .log-item { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--muted); }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .layout { flex-direction: column; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
    td { border: none; padding: 4px 6px; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 11px; display: block; }
  }
</style>
</head>
<body>

<header>
  <h1>🏠 家電・住まい点検リマインダー</h1>
  <p>エアコンフィルター、換気扇、電池交換など「前回いつやったか」忘れがちな住まいのメンテナンスを管理します。データはブラウザ内のみで保持され、外部送信されません。</p>
</header>

<div class="layout">

  <!-- ダッシュボード -->
  <div class="panel dashboard">
    <h2>📋 今週・今月やるべきこと</h2>
    <div class="dash-cards">
      <div class="dash-card danger">
        <div class="num" id="dashOverdue">0</div>
        <div class="label">期限切れ</div>
      </div>
      <div class="dash-card warn">
        <div class="num" id="dashWeek">0</div>
        <div class="label">7日以内</div>
      </div>
      <div class="dash-card">
        <div class="num" id="dashMonth">0</div>
        <div class="label">30日以内</div>
      </div>
      <div class="dash-card">
        <div class="num" id="dashTotal">0</div>
        <div class="label">登録項目数</div>
      </div>
    </div>
  </div>

  <!-- 左: 登録フォーム -->
  <div class="panel col-left">
    <h2>➕ 点検項目を登録</h2>

    <label>プリセットから追加</label>
    <div class="preset-row" id="presetButtons"></div>

    <h3>カスタム登録</h3>
    <label>項目名</label>
    <input type="text" id="itemName" placeholder="例: エアコンフィルター清掃">

    <label>カテゴリ</label>
    <select id="itemCategory">
      <option value="空調">空調</option>
      <option value="水回り">水回り</option>
      <option value="防災用品">防災用品</option>
      <option value="その他">その他</option>
    </select>

    <label>推奨頻度（日数）</label>
    <input type="number" id="itemFrequency" placeholder="例: 30" min="1">
    <div class="preset-row">
      <button class="small secondary" onclick="setFreq(14)">2週間</button>
      <button class="small secondary" onclick="setFreq(30)">1ヶ月</button>
      <button class="small secondary" onclick="setFreq(90)">3ヶ月</button>
      <button class="small secondary" onclick="setFreq(180)">半年</button>
      <button class="small secondary" onclick="setFreq(365)">1年</button>
    </div>

    <label>前回実施日（未実施なら空欄でOK）</label>
    <input type="date" id="itemLastDone">

    <button onclick="addItem()">登録する</button>

    <h3>データのエクスポート／インポート</h3>
    <textarea id="exportArea" placeholder="ここにエクスポート結果が表示されます。インポート時はここに貼り付けて「読み込む」を押してください。"></textarea>
    <button class="secondary" onclick="exportData()">エクスポート</button>
    <button class="secondary" onclick="importData()">読み込む</button>
  </div>

  <!-- 右: 一覧 -->
  <div class="panel col-right">
    <h2>🗒️ 点検項目一覧（次回予定順）</h2>

    <div class="filter-row" id="categoryFilter"></div>

    <table>
      <thead>
        <tr>
          <th>項目名</th>
          <th>カテゴリ</th>
          <th>次回予定日</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="itemTableBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">登録された点検項目がありません。左のフォームから登録してください。</div>

    <h3>📜 実施履歴</h3>
    <div class="log-list" id="logList"></div>
    <div class="empty-msg" id="emptyLogMsg" style="display:none;">まだ実施記録がありません。</div>

    <button class="secondary" onclick="copyList()">一覧をコピー</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ---- 状態管理（JS変数のみ・localStorage不使用） ----
  let items = [];
  let logs = [];
  let idCounter = 1;
  let activeCategory = "全て";

  const PRESETS = [
    { name: "エアコンフィルター清掃", category: "空調", frequency: 14 },
    { name: "換気扇・換気口掃除", category: "空調", frequency: 90 },
    { name: "火災報知器の電池交換", category: "防災用品", frequency: 365 },
    { name: "浄水器カートリッジ交換", category: "水回り", frequency: 60 },
    { name: "排水口・排水トラップ掃除", category: "水回り", frequency: 14 },
    { name: "洗濯機の糸くずフィルター清掃", category: "水回り", frequency: 14 }
  ];

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = String(str);
    return div.innerHTML;
  }

  function todayStr() {
    const d = new Date();
    return formatDate(d);
  }

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function daysBetween(dateStr1, dateStr2) {
    // dateStr2 - dateStr1 (days)
    const d1 = new Date(dateStr1 + "T00:00:00");
    const d2 = new Date(dateStr2 + "T00:00:00");
    return Math.round((d2 - d1) / 86400000);
  }

  function calcNextDate(item) {
    if (!item.lastDone) return todayStr(); // 未実施は「今日やるべき」扱い
    const d = new Date(item.lastDone + "T00:00:00");
    d.setDate(d.getDate() + Number(item.frequency || 0));
    return formatDate(d);
  }

  function getStatus(nextDate) {
    const diff = daysBetween(todayStr(), nextDate);
    if (diff <= 0) return "overdue";
    if (diff <= 7) return "soon";
    return "ok";
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  function setFreq(days) {
    document.getElementById("itemFrequency").value = days;
  }

  function renderPresets() {
    const wrap = document.getElementById("presetButtons");
    wrap.innerHTML = "";
    PRESETS.forEach((p, i) => {
      const btn = document.createElement("button");
      btn.className = "small secondary";
      btn.textContent = p.name;
      btn.onclick = () => addPreset(i);
      wrap.appendChild(btn);
    });
  }

  function addPreset(i) {
    const p = PRESETS[i];
    items.push({
      id: idCounter++,
      name: p.name,
      category: p.category,
      frequency: p.frequency,
      lastDone: ""
    });
    showToast(`「${p.name}」を追加しました`);
    render();
  }

  function addItem() {
    const nameEl = document.getElementById("itemName");
    const catEl = document.getElementById("itemCategory");
    const freqEl = document.getElementById("itemFrequency");
    const lastDoneEl = document.getElementById("itemLastDone");

    const name = nameEl.value.trim();
    let frequency = parseInt(freqEl.value, 10);

    if (!name) {
      showToast("項目名を入力してください");
      return;
    }
    if (isNaN(frequency) || frequency <= 0) {
      frequency = 30; // フォールバック値
    }
    if (frequency > 3650) frequency = 3650; // 極端な値のガード（約10年上限）

    items.push({
      id: idCounter++,
      name: name,
      category: catEl.value,
      frequency: frequency,
      lastDone: lastDoneEl.value || ""
    });

    nameEl.value = "";
    freqEl.value = "";
    lastDoneEl.value = "";

    showToast(`「${name}」を登録しました`);
    render();
  }

  function markDone(id) {
    const item = items.find(it => it.id === id);
    if (!item) return;
    const today = todayStr();
    item.lastDone = today;
    logs.unshift({ date: today, name: item.name });
    showToast(`「${item.name}」を実施済みにしました`);
    render();
  }

  function deleteItem(id) {
    const item = items.find(it => it.id === id);
    items = items.filter(it => it.id !== id);
    if (item) showToast(`「${item.name}」を削除しました`);
    render();
  }

  function setCategory(cat) {
    activeCategory = cat;
    render();
  }

  function renderFilters() {
    const wrap = document.getElementById("categoryFilter");
    const cats = ["全て", "空調", "水回り", "防災用品", "その他"];
    wrap.innerHTML = "";
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      btn.className = cat === activeCategory ? "active" : "";
      btn.onclick = () => setCategory(cat);
      wrap.appendChild(btn);
    });
  }

  function render() {
    // 次回予定日を計算してソート
    const enriched = items.map(it => {
      const nextDate = calcNextDate(it);
      const status = getStatus(nextDate);
      return { ...it, nextDate, status };
    }).sort((a, b) => a.nextDate < b.nextDate ? -1 : a.nextDate > b.nextDate ? 1 : 0);

    // ダッシュボード集計
    const overdueCount = enriched.filter(it => it.status === "overdue").length;
    const weekCount = enriched.filter(it => {
      const diff = daysBetween(todayStr(), it.nextDate);
      return diff > 0 && diff <= 7;
    }).length;
    const monthCount = enriched.filter(it => {
      const diff = daysBetween(todayStr(), it.nextDate);
      return diff > 0 && diff <= 30;
    }).length;

    document.getElementById("dashOverdue").textContent = overdueCount;
    document.getElementById("dashWeek").textContent = weekCount;
    document.getElementById("dashMonth").textContent = monthCount;
    document.getElementById("dashTotal").textContent = items.length;

    // フィルタ適用
    const filtered = activeCategory === "全て"
      ? enriched
      : enriched.filter(it => it.category === activeCategory);

    // テーブル描画
    const tbody = document.getElementById("itemTableBody");
    tbody.innerHTML = "";
    document.getElementById("emptyMsg").style.display = filtered.length === 0 ? "block" : "none";

    filtered.forEach(it => {
      const tr = document.createElement("tr");
      if (it.status === "overdue") tr.className = "overdue-row";
      else if (it.status === "soon") tr.className = "soon-row";

      const statusLabel = it.status === "overdue" ? "期限切れ" : it.status === "soon" ? "もうすぐ" : "OK";
      const diff = daysBetween(todayStr(), it.nextDate);
      const diffLabel = diff < 0 ? `${Math.abs(diff)}日超過` : diff === 0 ? "本日" : `あと${diff}日`;

      tr.innerHTML = `
        <td data-label="項目名">${escapeHtml(it.name)}</td>
        <td data-label="カテゴリ"><span class="tag">${escapeHtml(it.category)}</span></td>
        <td data-label="次回予定日">${escapeHtml(it.nextDate)}（${escapeHtml(diffLabel)}）</td>
        <td data-label="状態"><span class="status-badge ${it.status}">${statusLabel}</span></td>
        <td data-label="操作">
          <button class="small" data-action="done" data-id="${it.id}">実施した</button>
          <button class="small danger-btn" data-action="delete" data-id="${it.id}">削除</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // ログ描画
    const logList = document.getElementById("logList");
    logList.innerHTML = "";
    document.getElementById("emptyLogMsg").style.display = logs.length === 0 ? "block" : "none";
    logs.slice(0, 30).forEach(log => {
      const div = document.createElement("div");
      div.className = "log-item";
      div.textContent = `${log.date} - ${log.name} を実施`;
      logList.appendChild(div);
    });

    renderFilters();
  }

  // イベント委譲（動的生成ボタンのため）
  document.getElementById("itemTableBody").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.action === "done") markDone(id);
    if (btn.dataset.action === "delete") deleteItem(id);
  });

  // ---- コピー機能（フォールバック付き） ----
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("クリップボードにコピーしました");
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      showToast("クリップボードにコピーしました");
    } catch (e) {
      showToast("コピーに失敗しました。手動で選択してください");
    }
    document.body.removeChild(ta);
  }

  function copyList() {
    if (items.length === 0) {
      showToast("コピーする項目がありません");
      return;
    }
    const enriched = items.map(it => {
      const nextDate = calcNextDate(it);
      const status = getStatus(nextDate);
      const statusLabel = status === "overdue" ? "期限切れ" : status === "soon" ? "もうすぐ" : "OK";
      return `[${it.category}] ${it.name} - 次回: ${nextDate}（${statusLabel}）`;
    });
    copyToClipboard(enriched.join("\n"));
  }

  // ---- エクスポート／インポート ----
  function exportData() {
    const payload = {
      items: items,
      logs: logs,
      idCounter: idCounter
    };
    document.getElementById("exportArea").value = JSON.stringify(payload, null, 2);
    showToast("エクスポートしました。テキストをコピーして保存してください");
  }

  function importData() {
    const raw = document.getElementById("exportArea").value.trim();
    if (!raw) {
      showToast("貼り付けるデータがありません");
      return;
    }
    try {
      const data = JSON.parse(raw);
      if (!Array.isArray(data.items)) throw new Error("形式が不正です");
      items = data.items.map(it => ({
        id: typeof it.id === "number" ? it.id : idCounter++,
        name: String(it.name || "無題"),
        category: ["空調", "水回り", "防災用品", "その他"].includes(it.category) ? it.category : "その他",
        frequency: Number(it.frequency) > 0 ? Number(it.frequency) : 30,
        lastDone: it.lastDone || ""
      }));
      logs = Array.isArray(data.logs) ? data.logs : [];
      idCounter = Number(data.idCounter) > idCounter ? Number(data.idCounter) : (Math.max(0, ...items.map(i => i.id)) + 1);
      showToast("データを読み込みました");
      render();
    } catch (e) {
      showToast("読み込みに失敗しました。形式を確認してください");
    }
  }

  // 初期化
  renderPresets();
  render();
</script>

</body>
</html>
