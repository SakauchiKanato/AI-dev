<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APIクォータウォッチャー</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262638;
    --accent: #4fa3d1;
    --text: #e8e6f2;
    --muted: #9a97b5;
    --border: #3a3a52;
    --warn: #d9a441;
    --danger: #d15a5a;
    --ok: #4fbf87;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 20px;
  }
  header { margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0 0 4px 0; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }
  .layout {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: var(--text);
  }
  .col-left { flex: 1 1 320px; min-width: 280px; }
  .col-right { flex: 2 1 420px; min-width: 300px; }
  #tabBar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #10101a;
    border-color: var(--accent);
    font-weight: bold;
  }
  .add-tab-btn {
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #10101a; font-weight: bold; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .dashboard-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat-box {
    flex: 1 1 140px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-box .label { font-size: 11px; color: var(--muted); }
  .stat-box .value { font-size: 22px; font-weight: bold; margin-top: 4px; }
  .bar-track {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 14px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar-fill { height: 100%; background: var(--ok); transition: width 0.3s; }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.danger { background: var(--danger); }
  .level-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .level-低 { background: #2f4f3a; color: var(--ok); }
  .level-中 { background: #4a4526; color: var(--warn); }
  .level-高, .level-危険 { background: #4a2626; color: var(--danger); }
  #logList { max-height: 260px; overflow-y: auto; margin-top: 10px; font-size: 12px; }
  .log-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  .log-row:last-child { border-bottom: none; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--accent);
    color: #10101a;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px 0; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .dashboard-grid { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>APIクォータウォッチャー</h1>
  <p>AI APIのレート制限（1分あたり・1日あたりの上限）に対して、あとどれくらい呼び出せるかを管理します</p>
</header>

<div class="layout">
  <div class="col-left panel">
    <h2>サービス設定</h2>
    <div id="tabBar"></div>

    <label for="settingName">サービス名</label>
    <input type="text" id="settingName" maxlength="40">

    <label for="settingPerMin">1分あたりの上限（0=無制限）</label>
    <input type="number" id="settingPerMin" min="0" step="1">

    <label for="settingPerDay">1日あたりの上限（0=無制限）</label>
    <input type="number" id="settingPerDay" min="0" step="1">

    <div class="btn-row">
      <button class="btn-danger" id="removeServiceBtn" onclick="removeActiveService()">このサービスを削除</button>
    </div>

    <p class="hint">
      サービスを追加: 上のタブ末尾の「＋」から追加できます。設定は入力するとすぐに反映されます。<br>
      ブラウザの保存機能は使わないため、リロードするとデータは消えます。下部の「エクスポート」でテキスト保存し、次回起動時に「インポート」で復元してください。
    </p>
  </div>

  <div class="col-right panel">
    <h2>使用状況ダッシュボード</h2>
    <div class="dashboard-grid" id="dashboard"></div>

    <div class="btn-row">
      <button class="btn-primary" onclick="recordCall()">呼び出した（記録する）</button>
      <button class="btn-secondary" onclick="clearLogs()">このサービスのログをクリア</button>
    </div>

    <h2 style="margin-top:18px;">呼び出しログ（直近20件）</h2>
    <div id="logList"></div>

    <h2 style="margin-top:18px;">エクスポート / インポート</h2>
    <textarea id="ioArea" placeholder="ここにエクスポート結果が表示されます。インポートする場合はここに貼り付けて「インポート」を押してください。"></textarea>
    <div class="btn-row">
      <button class="btn-secondary" onclick="exportData()">エクスポート（コピー）</button>
      <button class="btn-secondary" onclick="importData()">インポート</button>
    </div>
    <p class="hint" id="ioMessage"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---- 初期データ ----
  var services = [
    { id: 's1', name: 'Claude API', perMin: 50, perDay: 1000, logs: [] },
    { id: 's2', name: 'OpenAI API', perMin: 60, perDay: 10000, logs: [] },
    { id: 's3', name: 'Gemini API', perMin: 60, perDay: 1500, logs: [] }
  ];
  var activeId = services[0].id;
  var idCounter = services.length;

  function getActive() {
    for (var i = 0; i < services.length; i++) {
      if (services[i].id === activeId) return services[i];
    }
    return services[0] || null;
  }

  function findService(id) {
    for (var i = 0; i < services.length; i++) {
      if (services[i].id === id) return services[i];
    }
    return null;
  }

  // ---- タブバー ----
  function renderTabBar() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    services.forEach(function (svc) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (svc.id === activeId ? ' active' : '');
      btn.textContent = svc.name || '(名称未設定)';
      btn.onclick = function () {
        activeId = svc.id;
        renderAll();
      };
      bar.appendChild(btn);
    });
    var addBtn = document.createElement('button');
    addBtn.className = 'add-tab-btn';
    addBtn.textContent = '＋ 追加';
    addBtn.onclick = addService;
    bar.appendChild(addBtn);
  }

  function addService() {
    idCounter++;
    var newSvc = { id: 's' + idCounter, name: '新しいサービス', perMin: 30, perDay: 500, logs: [] };
    services.push(newSvc);
    activeId = newSvc.id;
    renderAll();
  }

  function removeActiveService() {
    if (services.length <= 1) {
      showToast('最低1つのサービスは残す必要があります');
      return;
    }
    var idx = -1;
    for (var i = 0; i < services.length; i++) {
      if (services[i].id === activeId) { idx = i; break; }
    }
    if (idx === -1) return;
    services.splice(idx, 1);
    activeId = services[0].id;
    renderAll();
  }

  // ---- 設定パネル ----
  function renderSettings() {
    var svc = getActive();
    if (!svc) return;
    document.getElementById('settingName').value = svc.name;
    document.getElementById('settingPerMin').value = svc.perMin;
    document.getElementById('settingPerDay').value = svc.perDay;
  }

  document.getElementById('settingName').addEventListener('input', function (e) {
    var svc = getActive();
    if (!svc) return;
    svc.name = e.target.value.slice(0, 40);
    renderTabBar();
  });
  document.getElementById('settingPerMin').addEventListener('input', function (e) {
    var svc = getActive();
    if (!svc) return;
    var v = parseInt(e.target.value, 10);
    svc.perMin = isNaN(v) || v < 0 ? 0 : v;
    renderDashboard();
  });
  document.getElementById('settingPerDay').addEventListener('input', function (e) {
    var svc = getActive();
    if (!svc) return;
    var v = parseInt(e.target.value, 10);
    svc.perDay = isNaN(v) || v < 0 ? 0 : v;
    renderDashboard();
  });

  // ---- 記録 ----
  function recordCall() {
    var svc = getActive();
    if (!svc) return;
    svc.logs.push(Date.now());
    // ログが増えすぎないよう直近500件だけ保持
    if (svc.logs.length > 500) {
      svc.logs = svc.logs.slice(svc.logs.length - 500);
    }
    renderDashboard();
    renderLogList();
    showToast('記録しました');
  }

  function clearLogs() {
    var svc = getActive();
    if (!svc) return;
    svc.logs = [];
    renderDashboard();
    renderLogList();
  }

  // ---- 集計 ----
  function countInLastMs(logs, ms, now) {
    var count = 0;
    for (var i = logs.length - 1; i >= 0; i--) {
      if (now - logs[i] <= ms) count++;
      else break; // logsは古い順に並んでいる前提なので、範囲外に出たら打ち切り
    }
    return count;
  }

  function levelFromRatio(ratio) {
    if (ratio >= 1) return '危険';
    if (ratio >= 0.8) return '高';
    if (ratio >= 0.5) return '中';
    return '低';
  }

  function barClass(ratio) {
    if (ratio >= 1) return 'danger';
    if (ratio >= 0.8) return 'warn';
    return '';
  }

  function statBox(label, valueText, extraHtmlEl) {
    var box = document.createElement('div');
    box.className = 'stat-box';
    var l = document.createElement('div');
    l.className = 'label';
    l.textContent = label;
    var v = document.createElement('div');
    v.className = 'value';
    v.textContent = valueText;
    box.appendChild(l);
    box.appendChild(v);
    if (extraHtmlEl) box.appendChild(extraHtmlEl);
    return box;
  }

  function renderDashboard() {
    var svc = getActive();
    var dash = document.getElementById('dashboard');
    dash.innerHTML = '';
    if (!svc) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'サービスがありません';
      dash.appendChild(empty);
      return;
    }
    var now = Date.now();
    var usedMin = countInLastMs(svc.logs, 60 * 1000, now);
    var usedDay = countInLastMs(svc.logs, 24 * 60 * 60 * 1000, now);

    // 分あたり
    var minRatio = svc.perMin > 0 ? usedMin / svc.perMin : 0;
    var minRemain = svc.perMin > 0 ? Math.max(0, svc.perMin - usedMin) : Infinity;
    var minBox = statBox('直近1分の使用数', usedMin + (svc.perMin > 0 ? ' / ' + svc.perMin : ' （無制限）'));
    var minBarTrack = document.createElement('div');
    minBarTrack.className = 'bar-track';
    var minBarFill = document.createElement('div');
    minBarFill.className = 'bar-fill ' + barClass(minRatio);
    minBarFill.style.width = Math.min(100, minRatio * 100) + '%';
    minBarTrack.appendChild(minBarFill);
    minBox.appendChild(minBarTrack);
    var minLevel = document.createElement('span');
    minLevel.className = 'level-badge level-' + levelFromRatio(minRatio);
    minLevel.textContent = svc.perMin > 0 ? '警戒度: ' + levelFromRatio(minRatio) : '上限未設定';
    minBox.appendChild(minLevel);
    dash.appendChild(minBox);

    // 日あたり
    var dayRatio = svc.perDay > 0 ? usedDay / svc.perDay : 0;
    var dayBox = statBox('本日の使用数', usedDay + (svc.perDay > 0 ? ' / ' + svc.perDay : ' （無制限）'));
    var dayBarTrack = document.createElement('div');
    dayBarTrack.className = 'bar-track';
    var dayBarFill = document.createElement('div');
    dayBarFill.className = 'bar-fill ' + barClass(dayRatio);
    dayBarFill.style.width = Math.min(100, dayRatio * 100) + '%';
    dayBarTrack.appendChild(dayBarFill);
    dayBox.appendChild(dayBarTrack);
    var dayLevel = document.createElement('span');
    dayLevel.className = 'level-badge level-' + levelFromRatio(dayRatio);
    dayLevel.textContent = svc.perDay > 0 ? '警戒度: ' + levelFromRatio(dayRatio) : '上限未設定';
    dayBox.appendChild(dayLevel);
    dash.appendChild(dayBox);

    // 残り回数
    var remainText = svc.perMin > 0 ? String(minRemain) + '回' : '無制限';
    dash.appendChild(statBox('分あたり残り回数', remainText));

    // 次の枠が空くまでの時間
    var countdownText = '—';
    if (svc.perMin > 0 && usedMin >= svc.perMin) {
      // 直近1分ウィンドウ内の最も古いログが抜けるまでの時間
      var windowLogs = [];
      for (var i = svc.logs.length - 1; i >= 0; i--) {
        if (now - svc.logs[i] <= 60000) windowLogs.push(svc.logs[i]);
        else break;
      }
      var oldest = windowLogs.length > 0 ? windowLogs[windowLogs.length - 1] : now;
      var waitMs = Math.max(0, 60000 - (now - oldest));
      countdownText = Math.ceil(waitMs / 1000) + '秒後';
    } else if (svc.perMin > 0) {
      countdownText = '余裕あり';
    }
    dash.appendChild(statBox('次の空き枠まで', countdownText));
  }

  // ---- ログ一覧 ----
  function formatTime(ts) {
    var d = new Date(ts);
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function renderLogList() {
    var svc = getActive();
    var list = document.getElementById('logList');
    list.innerHTML = '';
    if (!svc || svc.logs.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'まだ記録がありません';
      list.appendChild(empty);
      return;
    }
    var recent = svc.logs.slice(-20).reverse();
    recent.forEach(function (ts, idx) {
      var row = document.createElement('div');
      row.className = 'log-row';
      var left = document.createElement('span');
      left.textContent = '#' + (svc.logs.length - idx);
      var right = document.createElement('span');
      right.textContent = formatTime(ts);
      row.appendChild(left);
      row.appendChild(right);
      list.appendChild(row);
    });
  }

  // ---- エクスポート / インポート ----
  function exportData() {
    var payload = {
      exportedAt: new Date().toISOString(),
      activeId: activeId,
      idCounter: idCounter,
      services: services
    };
    var text = JSON.stringify(payload);
    document.getElementById('ioArea').value = text;
    copyToClipboard(text);
    document.getElementById('ioMessage').textContent = 'エクスポートしてクリップボードにコピーしました。';
  }

  function importData() {
    var raw = document.getElementById('ioArea').value.trim();
    var msg = document.getElementById('ioMessage');
    if (!raw) {
      msg.textContent = 'インポートするテキストが空です。';
      return;
    }
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      msg.textContent = 'インポートに失敗しました: JSON形式が正しくありません。';
      return;
    }
    if (!parsed || !Array.isArray(parsed.services) || parsed.services.length === 0) {
      msg.textContent = 'インポートに失敗しました: サービスデータが見つかりません。';
      return;
    }
    var okServices = [];
    for (var i = 0; i < parsed.services.length; i++) {
      var s = parsed.services[i];
      if (!s || typeof s.id !== 'string') continue;
      okServices.push({
        id: s.id,
        name: typeof s.name === 'string' ? s.name.slice(0, 40) : '(無題)',
        perMin: typeof s.perMin === 'number' && s.perMin >= 0 ? s.perMin : 0,
        perDay: typeof s.perDay === 'number' && s.perDay >= 0 ? s.perDay : 0,
        logs: Array.isArray(s.logs) ? s.logs.filter(function (n) { return typeof n === 'number'; }) : []
      });
    }
    if (okServices.length === 0) {
      msg.textContent = 'インポートに失敗しました: 有効なサービスがありません。';
      return;
    }
    services = okServices;
    idCounter = typeof parsed.idCounter === 'number' ? parsed.idCounter : services.length;
    activeId = (typeof parsed.activeId === 'string' && findService(parsed.activeId)) ? parsed.activeId : services[0].id;
    renderAll();
    msg.textContent = 'インポートしました（' + services.length + '件のサービス）。';
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {
      // コピー失敗は無視（テキストエリアには表示済みなので手動コピー可能）
    }
    document.body.removeChild(ta);
  }

  // ---- トースト ----
  var toastTimer = null;
  function showToast(text) {
    var toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 1600);
  }

  // ---- 全体描画 ----
  function renderAll() {
    renderTabBar();
    renderSettings();
    renderDashboard();
    renderLogList();
  }

  renderAll();
  // ダッシュボード（カウントダウン等）は1秒ごとに更新
  setInterval(renderDashboard, 1000);
</script>

</body>
</html>
